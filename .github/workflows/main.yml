name: Deploy to GitHub Pages (via gh-pages)

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare site
        run: |
          set -e
          mkdir -p public
          # Copy portfolio.html to be served as index
          cp portfolio.html public/index.html || true
          # Copy assets if present
          if [ -d assets ]; then
            cp -r assets public/
          fi

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          # optional: keep history or not
          # keep_files: false
