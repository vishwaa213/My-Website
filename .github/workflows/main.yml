name: Deploy to GitHub Pages (via gh-pages)

on:
  push:
    branches:
      - main

permissions:
  contents: write     # <-- required so GITHUB_TOKEN can push gh-pages
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare site
        run: |
          set -e
          mkdir -p public
          cp portfolio.html public/index.html || true
          if [ -d assets ]; then
            cp -r assets public/
          fi

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          # publish_branch: gh-pages      # optional, default is gh-pages
